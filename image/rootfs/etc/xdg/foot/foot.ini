# AgentOS terminal: a frosted dark panel that matches the agentos-shell glass
# look. The colours are the shell's palette; the setup wizard (whiptail) picks
# its dialog colours from these 16 slots, see agentos-setup.
font=Noto Sans Mono CJK SC:size=12
line-height=17
pad=28x22 center

[cursor]
style=beam
blink=yes
color=0b1220 7cc4ff

[colors]
# Translucent: the desktop gradient shows through behind the text.
alpha=0.84
background=0b1220
foreground=e6ecf8
selection-background=2c4a7e
selection-foreground=ffffff
# regular0 = background, so full-screen TUIs blend into the panel.
regular0=0b1220
regular1=ff7a7a
regular2=6ee7a8
regular3=ffb86b
regular4=5b9bff
regular5=c4a7ff
regular6=7cc4ff
regular7=c3cde0
# bright0 = dialog panel, bright4 = accent (focused controls).
bright0=172238
bright1=ffb3b5
bright2=9ff0c4
bright3=ffd2a1
bright4=3b82f6
bright5=ddc9ff
bright6=b5ddff
bright7=ffffff
