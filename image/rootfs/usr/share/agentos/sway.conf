# AgentOS desktop session: agentos-shell fills the screen; terminals and the
# setup wizard float above it.
output * bg #0b0f1c solid_color
default_border none
default_floating_border pixel 1
# Hairline frame like the shell's glass panels.
client.focused          #3a4a6b #0b1220 #ffffff #7cc4ff #3a4a6b
client.focused_inactive #222d44 #0b1220 #c3cde0 #7cc4ff #222d44
client.unfocused        #222d44 #0b1220 #c3cde0 #7cc4ff #222d44
focus_follows_mouse no

input type:keyboard xkb_layout us

# Pinyin input: Ctrl+Space toggles (fcitx5 default).
exec fcitx5 -d --replace

for_window [app_id="foot"] floating enable, border pixel 1, resize set 960 600, move position center
for_window [app_id="agentos-setup"] floating enable, border pixel 1, resize set 900 600, move position center
for_window [app_id="agentos-console"] fullscreen enable
exec /usr/local/bin/agentos-desktop

# Escape hatches.
bindsym Mod4+Return exec foot
bindsym Ctrl+Alt+Delete exec swaymsg exit
