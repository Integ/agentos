# AgentOS desktop session: agentos-shell fills the screen; terminals and the
# setup wizard float above it.
output * bg #0b0f1c solid_color
default_border none
default_floating_border pixel 1
# Hairline frame like the shell's glass panels.
client.focused          #3a4a6b #0b1220 #ffffff #7cc4ff #3a4a6b
client.focused_inactive #222d44 #0b1220 #c3cde0 #7cc4ff #222d44
client.unfocused        #222d44 #0b1220 #c3cde0 #7cc4ff #222d44
# The user's theme (agentos theme <名字>) replaces the colors above; sway
# skips a missing file, so before any theme is chosen these stay.
include ~/.config/agentos/sway-theme.conf
focus_follows_mouse no

# Laptop touchpads: tap to click (one finger = left, two = right, three =
# middle), as most people expect.
input type:touchpad {
    tap enabled
    tap_button_map lrm
}

# Caps Lock is the push-to-talk key: caps:none stops it toggling caps, and
# the task service uses its LED as the recording light.
input type:keyboard {
    xkb_layout us
    xkb_options caps:none
}

# Pinyin input: Ctrl+Space toggles (fcitx5 default).
exec fcitx5 -d --replace

for_window [app_id="foot"] floating enable, border pixel 1, resize set 960 600, move position center
for_window [app_id="agentos-setup"] floating enable, border pixel 1, resize set 900 600, move position center
for_window [app_id="agentos-console"] fullscreen enable
exec /usr/local/bin/agentos-desktop

# Super+Space: talk to the butler from anywhere; Super+Alt+Space: the menu.
# The desktop is focused first, since a floating terminal may hold the keyboard.
bindsym Mod4+space [title="^AgentOS$"] focus; exec /usr/local/bin/agentos-shell --summon
bindsym Mod4+Mod1+space [title="^AgentOS$"] focus; exec /usr/local/bin/agentos-shell --menu

# Escape hatches. The terminal opens in the theme's colors.
bindsym Mod4+Return exec /usr/local/bin/agentos-shell --terminal
bindsym Ctrl+Alt+Delete exec swaymsg exit
