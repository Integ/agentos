# AgentOS kiosk session: one full-screen terminal running the butler agent.
output * bg #0f1419 solid_color
default_border none
default_floating_border none
focus_follows_mouse no

input type:keyboard xkb_layout us

# Pinyin input: Ctrl+Space toggles (fcitx5 default).
exec fcitx5 -d --replace

for_window [app_id="agentos"] fullscreen enable
exec "foot --app-id agentos /usr/local/bin/agentos-shell; swaymsg exit"

# Escape hatches.
bindsym Mod4+Return exec foot
bindsym Ctrl+Alt+Delete exec swaymsg exit
