name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Plugin sandbox, plus WebKitGTK/GTK headers for the graphical shell. Ubuntu 24.04 blocks unprivileged user namespaces via
      # AppArmor; lift that so bubblewrap works and the sandbox tests run.
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap libwebkit2gtk-4.1-dev libgtk-3-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap OK"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
