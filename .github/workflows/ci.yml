name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new advisories can hit dependencies that did not change.
    - cron: "17 3 * * 1"

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Plugin sandbox, plus WebKitGTK/GTK headers for the graphical shell. Ubuntu 24.04 blocks unprivileged user namespaces via
      # AppArmor; lift that so bubblewrap works and the sandbox tests run.
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap libwebkit2gtk-4.1-dev libgtk-3-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap OK"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # agentos-update against a fake release API (uses target/debug/agentos-taskd
      # and agentos; already built by the tests), and the v0.4.0 updater
      # against the same bundle.
      - run: cargo build -p agentos-taskd -p agentos-cli && image/test/update-test.sh

  # The declared rust-version is a promise for every crate, including the
  # sandboxed services and the graphical shell that the test matrix below
  # cannot run on every platform; compile all of them with it.
  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check --locked --workspace --all-targets

  # Known vulnerabilities (RustSec), licenses and dependency sources; see deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  web-shell:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check crates/web-shell/assets/shell.js
      - run: node --check crates/web-shell/assets/realtime-voice.js
      - run: node --test crates/web-shell/assets/*.test.mjs

  persistent-runtime:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        include:
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: 1.88.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p agentos-taskd -p agentos-web-shell -p agentos-cli -p agentos-ipc -p agentos-runtime -p agentos-audit -p agentos-planner -p agentos-core -p agentos-policy
