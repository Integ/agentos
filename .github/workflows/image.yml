name: Image

# Builds the bootable AgentOS disk image and boots it in QEMU (Secure Boot
# on): self-check from the "USB stick", unattended install onto a second disk,
# then self-check again from the installed disk.
#
# Runs only when a GitHub release is published (both Debian and Ubuntu,
# images attached to the release) or when started by hand from Actions →
# Image → Run workflow. Pushes and pull requests do not build images.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      distro:
        description: "Base distribution"
        type: choice
        options: [debian, ubuntu, both]
        default: debian

permissions:
  contents: write # attach images to the release

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON((github.event_name == 'release' || inputs.distro == 'both') && '["debian","ubuntu"]' || format('["{0}"]', inputs.distro)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          DISTRO: ${{ matrix.distro }}
          AGENTOS_RELEASE: ${{ github.event.release.tag_name }}
          COMPRESS: "1"
          # archive.ubuntu.com is slow from GitHub's runners (~1.4 MB/s);
          # the in-region Azure mirror is the one the runners themselves use.
          MIRROR: ${{ matrix.distro == 'ubuntu' && 'http://azure.archive.ubuntu.com/ubuntu' || '' }}
        run: image/build-in-docker.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Smoke test in QEMU
        run: sudo TIMEOUT=600 image/test/qemu-smoke.sh out/agentos-${{ matrix.distro }}-x86_64.img out/smoke

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.distro }}
          path: |
            out/smoke/*.log
            out/smoke/*.png
          if-no-files-found: ignore

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: agentos-${{ matrix.distro }}-x86_64
          path: |
            out/agentos-${{ matrix.distro }}-x86_64.img.xz
            out/agentos-${{ matrix.distro }}-x86_64.img.xz.sha256
          compression-level: 0
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            out/agentos-${{ matrix.distro }}-x86_64.img.xz \
            out/agentos-${{ matrix.distro }}-x86_64.img.xz.sha256

  # The update bundle `agentos-update` installs on existing machines. Same
  # binaries for both bases (built on Debian 12, like the images).
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe

      - name: Build update bundle
        env:
          BUNDLE_ONLY: "1"
          AGENTOS_RELEASE: ${{ github.event.release.tag_name }}
        run: image/build-in-docker.sh

      - name: Test agentos-update against the bundle
        run: image/test/update-test.sh out/agentos-update-x86_64.tar.gz

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: agentos-update-x86_64
          path: |
            out/agentos-update-x86_64.tar.gz
            out/agentos-update-x86_64.tar.gz.sha256
          compression-level: 0
          retention-days: 14

      - name: Attach to release
        if: github.event.release.tag_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            out/agentos-update-x86_64.tar.gz \
            out/agentos-update-x86_64.tar.gz.sha256
