[workspace]
resolver = "2"
members = ["crates/core", "crates/policy", "crates/audit", "crates/agentosd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
agentos-core = { path = "crates/core" }
agentos-policy = { path = "crates/policy" }
agentos-audit = { path = "crates/audit" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
