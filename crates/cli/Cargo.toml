[package]
name = "agentos-cli"
description = "AgentOS Unix socket client and independent terminal task workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agentos"
path = "src/main.rs"

[dependencies]
agentos-core.workspace = true
agentos-runtime.workspace = true
agentos-ipc.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
# Only text rendering, for the WeChat login QR code in a terminal.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
agentos-audit.workspace = true
agentos-planner.workspace = true
agentos-policy.workspace = true
agentos-services.workspace = true
agentos-taskd = { path = "../taskd" }
